apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-rbac-proxy
data:
  config-file.yaml: |
    authorization:
      resourceAttributes:
        namespace: default
        apiVersion: v1
        apiGroup: ray.io
        resource: rayclusters
        name: ray-cluster-with-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-rbac-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-rbac-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-rbac-proxy
subjects:
- kind: ServiceAccount
  name: kube-rbac-proxy
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-rbac-proxy
rules:
- apiGroups: ["authentication.k8s.io"]
  resources:
  - tokenreviews
  verbs: ["create"]
- apiGroups: ["authorization.k8s.io"]
  resources:
  - subjectaccessreviews
  verbs: ["create"]
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cluster-with-auth
spec:
  headGroupSpec:
    enableIngress: true
    rayStartParams:
      dashboard-host: '127.0.0.1'
      dashboard-port: '8443'
    template:
      metadata:
      spec:
        serviceAccountName: kube-rbac-proxy
        containers:
        - name: ray-head
          image: quay.io/modh/ray@sha256:6d076aeb38ab3c34a6a2ef0f58dc667089aa15826fa08a73273c629333e12f1e
          ports:
          - containerPort: 6379
            name: gcs
          - containerPort: 8265
            name: dashboard
          - containerPort: 10001
            name: client
          resources:
            limits:
              cpu: "500m"
              memory: "8Gi"
            requests:
              cpu: "500m"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
              - bash
              - -c
              - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 10 -q -O- http://localhost:8443/api/gcs_healthz | grep success
            failureThreshold: 10
            initialDelaySeconds: 10
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command:
              - bash
              - -c
              - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 10 -q -O- http://localhost:8443/api/gcs_healthz | grep success
            failureThreshold: 120
            initialDelaySeconds: 30
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
        - name: kube-rbac-proxy
          image: registry.redhat.io/openshift4/ose-kube-rbac-proxy
          args:
          - "--insecure-listen-address=0.0.0.0:8265"
          - "--upstream=http://127.0.0.1:8443/"
          - "--config-file=/etc/kube-rbac-proxy/config-file.yaml"
          - "--logtostderr=true"
          volumeMounts:
          - name: config
            mountPath: /etc/kube-rbac-proxy
        volumes:
        - name: config
          configMap:
            name: kube-rbac-proxy
  workerGroupSpecs:
  - replicas: 1
    minReplicas: 1
    maxReplicas: 5
    groupName: worker-group
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: quay.io/modh/ray@sha256:6d076aeb38ab3c34a6a2ef0f58dc667089aa15826fa08a73273c629333e12f1e
          resources:
            limits:
              cpu: "500m"
              memory: "4Gi"
            requests:
              cpu: "500m"
              memory: "2Gi"
